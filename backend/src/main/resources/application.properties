spring.application.name=civic-road-issues-api
app.environment=${APP_ENV:local}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/roadwatch}
spring.datasource.username=${DATABASE_USER:roadwatch}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
app.storage.directory=${UPLOAD_DIRECTORY:./uploads}
app.geocoding.enabled=${GEOCODING_ENABLED:true}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:Roadwatch/1.0 (Civic road issue reporting project)}
app.ai.ollama-url=${OLLAMA_URL:}
app.ai.model=${OLLAMA_MODEL:llama3.2-vision}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.supabase.url=${SUPABASE_URL:}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:roadwatch-images}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=framework
