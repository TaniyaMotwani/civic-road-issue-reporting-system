services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadwatch
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - roadwatch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadwatch -d roadwatch"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://database:5432/roadwatch
      DATABASE_USER: roadwatch
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      UPLOAD_DIRECTORY: /app/uploads
      APP_ENV: ${APP_ENV:-local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-true}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-Roadwatch/1.0 (Civic road issue reporting project)}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2-vision}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-roadwatch-images}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
    volumes:
      - roadwatch-uploads:/app/uploads
volumes:
  roadwatch-db:
  roadwatch-uploads:
